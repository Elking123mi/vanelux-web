    /* Responsive fixes for mobile */

    /* ==========================================================
       LUXURY SPLASH SCREEN v2 - Cinematic loader
       ========================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');
    
    #loading-splash {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1), visibility 0.8s;
    }
    
    /* Animated gradient mesh background */
    #loading-splash::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: 
        radial-gradient(at 20% 20%, rgba(212,175,55,0.20) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(11,50,84,0.6) 0px, transparent 50%),
        radial-gradient(at 0% 80%, rgba(26,77,122,0.5) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(212,175,55,0.15) 0px, transparent 50%);
      animation: meshDrift 12s ease-in-out infinite;
    }

    /* Glowing orbs */
    #loading-splash::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, transparent 60%);
      filter: blur(60px);
      animation: orbFloat 8s ease-in-out infinite;
    }

    @keyframes meshDrift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(-3%, -2%) rotate(3deg); }
      66% { transform: translate(3%, -3%) rotate(-3deg); }
    }
    
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -30px) scale(1.15); }
    }
    
    #loading-splash.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: splashIn 1.2s cubic-bezier(0.65, 0, 0.35, 1);
    }

    @keyframes splashIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .splash-logo-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 36px;
    }

    .splash-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(212,175,55,0.5));
      animation: logoBreath 3s ease-in-out infinite;
    }

    @keyframes logoBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Rotating ring around logo */
    .splash-ring {
      position: absolute;
      inset: -20px;
      border: 2px solid transparent;
      border-top-color: #D4AF37;
      border-right-color: rgba(212,175,55,0.3);
      border-radius: 50%;
      animation: ringSpin 2.5s linear infinite;
    }

    .splash-ring-2 {
      inset: -35px;
      border-top-color: rgba(255,215,0,0.4);
      border-right-color: transparent;
      border-bottom-color: rgba(255,215,0,0.2);
      animation-duration: 4s;
      animation-direction: reverse;
    }

    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    .splash-brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #D4AF37 0%, #FFD700 50%, #f4d77b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      text-transform: uppercase;
      animation: brandReveal 1.5s cubic-bezier(0.65, 0, 0.35, 1);
    }

    @keyframes brandReveal {
      from { letter-spacing: 30px; opacity: 0; }
      to { letter-spacing: 12px; opacity: 1; }
    }

    .splash-tagline {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 48px;
    }

    /* Premium loading bar */
    .splash-bar {
      width: 240px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    .splash-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, #FFD700, transparent);
      animation: barSlide 1.6s ease-in-out infinite;
    }

    @keyframes barSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Floating particles in splash */
    .splash-particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #FFD700;
      border-radius: 50%;
      box-shadow: 0 0 6px #FFD700;
      animation: particleRise linear infinite;
    }

    @keyframes particleRise {
      0% { transform: translateY(100vh); opacity: 0; }
      10%, 90% { opacity: 0.8; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    @media screen and (max-width: 600px) {
      .splash-brand { font-size: 32px; letter-spacing: 8px; }
      .splash-logo-wrap { width: 100px; height: 100px; }
    }

    /* ==========================================================
       PREMIUM WHATSAPP FLOATING BUTTON
       ========================================================== */
    #whatsapp-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
      animation: whatsappPulse 2.5s ease-in-out infinite;
    }
    
    #whatsapp-float:hover {
      transform: scale(1.15) rotate(8deg);
    }
    
    #whatsapp-float svg {
      width: 32px;
      height: 32px;
      fill: white;
    }
    
    @keyframes whatsappPulse {
      0%, 100% { box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5), 0 0 0 0 rgba(37, 211, 102, 0.5); }
      50% { box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5), 0 0 0 18px rgba(37, 211, 102, 0); }
    }
    
    @media screen and (max-width: 600px) {
      #whatsapp-float {
        bottom: 16px;
        right: 16px;
        width: 56px;
        height: 56px;
      }
      #whatsapp-float svg { width: 28px; height: 28px; }
    }
  </style>
